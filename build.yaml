# jprm (Jellyfin Plugin Repository Manager) format; scripts/package.sh uses the same values.
name: "Holix"
guid: "06f19487-387d-4e2f-be1d-71f44efff069"
version: "0.5.2.0"
targetAbi: "12.2.0.0"
framework: "net10.0"
overview: "Holix Play: household/profile mapping, profile sessions, no watch history for guests"
description: >
  Server plugin for the Holix Play client. Each Holix profile is a hidden Jellyfin user; it provides
  profile creation/editing/deletion with the household owner's token, parental limits from age ratings
  (TR/US/DE), passwordless sessions on behalf of a profile, and no watch history for guest profiles.
category: "General"
owner: "Holix Play"
artifacts:
- "Jellyfin.Plugin.Holix.dll"
- "BouncyCastle.Cryptography.dll"
changelog: >
  0.5.2.0: household-wide session limit — profiles copy the owner's MaxActiveSessions, and the owner plus all
  profiles together may watch on at most that many screens (409 household_session_limit); "Who can create a
  household" setting (Everyone / Administrators only / Selected users, picked by name) replaces the
  AllowNonAdminOwners / AllowedOwnerUserIds settings, which are migrated automatically.
  0.5.1.0: removed the ClipsUrl setting; preview clips now use Jellyfin's standard theme videos (backdrops
  folder).
  0.5.0.0: new ClipsUrl setting — the holix-clips preview clip service address is announced to clients as
  ClipsUrl in /Holix/Info (omitted when empty), feature flag clips-url.
  0.4.0.0: GET /Holix/StreamAuth forwardAuth endpoint (reverse proxy closes Jellyfin's unauthenticated stream
  URLs; token + parental/library check per item, 60 s cache), Turkish rating labels Jellyfin does not know
  ("Genel İzleyici", "7 yaş ve üzeri", RTÜK content signs …) are scored by the plugin, proof clock-skew
  allowance lowered to 10 s.
  0.3.0.0: age thresholds moved to the band's age (US TV-Y7 is visible to a 7+ profile in every system;
  TR/US/DE share the same threshold, the system only sets the label), Household/Link returns the current
  household, PUT/DELETE /Holix/Profiles/{id}/Image (profile image stored as the Jellyfin UserImage).
  0.2.0.0: profile sessions require a short-lived proof signed by holix-cloud (Ed25519; PIN enforced
  server side), household ↔ holix-cloud linking (/Holix/Household/Link), mapping lock.
  0.1.0.0: initial release — /Holix/Info, /Holix/Household, /Holix/Profiles CRUD, profile sessions, guest protection.
